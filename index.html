
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Маленькое чудо в 3D — лабораторная №6</title>

<script type="importmap">
{
  "imports": {
    "three": "./three-shim.js",
    "three-real": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js"
  }
}
</script>

<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer/dist/model-viewer-module.min.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer-effects@1.5.0/dist/model-viewer-effects.min.js"></script>

<style>
:root {
  --bg: #FFF4E6;
  --panel: #FFF9F1;
  --ink: #54351F;
  --accent: #B67A45;
  --muted: #806C5C;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: Arial, sans-serif;
}

main {
  width: min(94%, 1100px);
  margin: auto;
  padding: 48px 0 25px;
}

header {
  text-align: center;
  margin-bottom: 30px;
}

.eyebrow {
  font-size: 11px;
  letter-spacing: 3px;
  font-weight: 700;
  color: var(--accent);
}

h1 {
  font: normal clamp(40px, 7vw, 75px) Georgia, serif;
  margin: 15px 0;
}

.subtitle {
  color: var(--muted);
  line-height: 1.6;
}

.viewer {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--accent);
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 20px 45px #0002;
}

model-viewer {
  display: block;
  width: 100%;
  height: 580px;
  background: radial-gradient(
    circle at center,
    var(--panel),
    var(--bg)
  );
  --poster-color: transparent;
}

.loading {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: var(--ink);
  pointer-events: none;
}

.ar-button {
  position: absolute;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  padding: 13px 23px;
  border: 1px solid var(--accent);
  border-radius: 14px;
  background: var(--accent);
  color: #FFFFFF;
  font-weight: 700;
  font-size: 14px;
  white-space: nowrap;
  cursor: pointer;
  box-shadow: 0 6px 20px #0003;
}

.ar-button:hover {
  filter: brightness(1.1);
}

.controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  margin-top: 22px;
}

.panel {
  padding: 23px;
  background: var(--panel);
  border: 1px solid var(--accent);
  border-radius: 20px;
}

.panel h2 {
  font: normal 25px Georgia, serif;
  margin: 0 0 16px;
}

.buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

button.control {
  padding: 11px 16px;
  border: 1px solid var(--accent);
  border-radius: 12px;
  background: var(--bg);
  color: var(--ink);
  font-weight: 600;
  cursor: pointer;
}

button.control:hover:not(:disabled) {
  filter: brightness(.95);
}

button.control.active {
  background: var(--accent);
  color: #FFFFFF;
}

button.control:disabled {
  opacity: .4;
  cursor: not-allowed;
}

.note {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.5;
}

footer {
  padding: 28px 0;
  text-align: center;
  color: var(--muted);
  font-size: 12px;
}

@media (max-width: 700px) {
  main { padding-top: 28px; }
  model-viewer { height: 420px; }
  .controls { grid-template-columns: 1fr; }
  .panel { padding: 17px; }
}
</style>
</head>

<body>
<main>

<header>
  <p class="eyebrow">ИНТЕРАКТИВНАЯ 3D-ГАЛЕРЕЯ</p>
  <h1>Маленькое чудо в 3D</h1>
  <p class="subtitle">
    Познакомьтесь с очаровательной кошкой в трёхмерном пространстве
  </p>
</header>

<section class="viewer">

  <model-viewer
    id="model"
    src="./7d79a48743c94a56ad79c051580500ae.glb"
    alt="3D-модель кошки"
    camera-controls
    touch-action="pan-y"
    auto-rotate
    auto-rotate-delay="0"
    rotation-per-second="15deg"
    interaction-prompt="none"
    shadow-intensity="1.53"
    shadow-softness="0.8"
    exposure="0.49"
    camera-orbit="0deg 75deg 20.36m"
    field-of-view="30deg"
    ar
    ar-modes="webxr scene-viewer quick-look"
    animation-crossfade-duration="1000">

    <effect-composer id="composer"></effect-composer>

    <button
      class="ar-button"
      slot="ar-button"
      type="button">
      ◈ Посмотреть в AR
    </button>

  </model-viewer>

  <div id="loading" class="loading">
    Загрузка 3D-модели...
  </div>

</section>

<div class="controls">

  <section class="panel">
    <h2>Анимация</h2>

    <div class="buttons">
      <button class="control" id="play" disabled>▶ Запустить</button>
      <button class="control" id="pause" disabled>⏸ Пауза</button>
      <button class="control" id="restart" disabled>↻ Сначала</button>
      <button class="control" id="next" disabled>Следующая анимация</button>
    </div>

    <p class="note" id="animation-info">
      Проверяем анимации...
    </p>
  </section>

  <section class="panel">
    <h2>Визуальные эффекты</h2>

    <div class="buttons">
      <button class="control" id="pixelate">Pixelate</button>
      <button class="control" id="glitch">Glitch</button>
      <button class="control" id="reset">Сбросить эффекты</button>
    </div>

    <p class="note">
      Эффекты можно включать одновременно.
    </p>
  </section>

</div>

<footer>
  Лабораторная работа №6 · Анимация, эффекты и дополненная реальность
</footer>

</main>

<script type="module">
const model = document.getElementById("model");
const loading = document.getElementById("loading");
const composer = document.getElementById("composer");
const info = document.getElementById("animation-info");

const play = document.getElementById("play");
const pause = document.getElementById("pause");
const restart = document.getElementById("restart");
const next = document.getElementById("next");

const pixelate = document.getElementById("pixelate");
const glitch = document.getElementById("glitch");
const reset = document.getElementById("reset");

let clips = [];
let index = 0;
let pixelOn = false;
let glitchOn = false;

function init() {
  loading.style.display = "none";
  clips = model.availableAnimations || [];

  if (!clips.length) {
    info.textContent = "В этой модели нет встроенных анимаций.";
    return;
  }

  index = 0;
  model.animationName = clips[0];
  model.play();

  play.disabled = false;
  pause.disabled = false;
  restart.disabled = false;
  next.disabled = clips.length < 2;

  updateInfo();
}

function updateInfo() {
  info.textContent =
    `Анимация ${index + 1} из ${clips.length}: ${clips[index]}`;
}

model.addEventListener("load", init);

model.addEventListener("error", e => {
  loading.textContent = "Не удалось загрузить модель";
  console.error(e);
});

if (model.loaded) init();

play.onclick = () => {
  if (clips.length) model.play();
};

pause.onclick = () => {
  if (clips.length) model.pause();
};

restart.onclick = () => {
  if (!clips.length) return;
  model.currentTime = 0;
  model.play();
};

next.onclick = () => {
  if (clips.length < 2) return;

  index = (index + 1) % clips.length;
  model.animationName = clips[index];
  model.play();
  updateInfo();
};

function applyEffects() {
  composer.replaceChildren();

  if (pixelOn) {
    const el = document.createElement("pixelate-effect");
    el.setAttribute("granularity", "32");
    composer.appendChild(el);
  }

  if (glitchOn) {
    const el = document.createElement("glitch-effect");
    el.setAttribute("mode", "constant");
    composer.appendChild(el);
  }

  pixelate.classList.toggle("active", pixelOn);
  glitch.classList.toggle("active", glitchOn);
}

pixelate.onclick = () => {
  pixelOn = !pixelOn;
  applyEffects();
};

glitch.onclick = () => {
  glitchOn = !glitchOn;
  applyEffects();
};

reset.onclick = () => {
  pixelOn = false;
  glitchOn = false;
  applyEffects();
};
</script>

</body>
</html>
