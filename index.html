
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Маленькое чудо в 3D</title>
  <meta name="description" content="Интерактивная веб-презентация 3D-модели кошки">

  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <main class="page">
    <header class="header">
      <span class="eyebrow">ИНТЕРАКТИВНАЯ 3D-ПРЕЗЕНТАЦИЯ</span>
      <h1>Маленькое чудо в 3D</h1>
      <p>Познакомьтесь с очаровательной кошкой в трёхмерном пространстве</p>
    </header>

    <section class="viewer-card">
      <model-viewer
        id="cat-model"
        src="7d79a48743c94a56ad79c051580500ae.glb"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        tone-mapping="neutral"
        poster="poster.webp"
        shadow-intensity="1.53"
        autoplay
        auto-rotate
        camera-orbit="0deg 75deg 20.36m"
        field-of-view="30deg"
        exposure="0.49"
        shadow-softness="1">

        <div class="progress-bar hide" slot="progress-bar">
          <div class="update-bar"></div>
        </div>

        <button slot="ar-button" id="ar-button">
          Посмотреть в AR
        </button>

        <div id="ar-prompt">
          <img src="ar_hand_prompt.png" alt="Подсказка для AR">
        </div>
      </model-viewer>

      <div class="viewer-caption">
        <span>✦</span>
        Вращайте модель мышью и приближайте колесиком
        <span>✦</span>
      </div>
    </section>

    <section class="features">
      <div class="feature">↻ Вращение модели</div>
      <div class="feature">⊕ Приближение</div>
      <div class="feature">✧ Автовращение</div>
    </section>

    <footer>
      Лабораторная работа №5 · Интерактивная веб-презентация 3D-модели
    </footer>
  </main>

  <script src="script.js"></script>
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js">
  </script>
</body>
</html>
